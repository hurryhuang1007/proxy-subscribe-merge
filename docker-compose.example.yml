# 复制为 docker-compose.yml，放好 config.json 后在同目录执行：
#   docker compose up -d --build

services:
  gateway:
    build: .
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      CONFIG_PATH: "/config/config.json"
      SESSION_SECRET: "请替换为至少32位随机字符串_abcdefghijklmnop"
    volumes:
      - ./config.json:/config/config.json
