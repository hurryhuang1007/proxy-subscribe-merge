# 复制为 docker-compose.yml，在同目录放好 config.json 后执行：
#   docker compose up -d
# 默认从 GHCR 拉取已构建镜像。若要本地构建：
#   docker compose up -d --build
#
# 将 GitHub 仓库设为公开：仓库页 Settings → Danger zone → Change repository visibility → Public。
# GHCR 镜像默认可仍为 Private：Packages → proxy-subscribe-merge → Package settings → Change visibility → Public，
# 否则拉取前需执行 docker login ghcr.io（使用有 read:packages 权限的 PAT）。
#
# 若 fork 本仓库，请把 image 改为 ghcr.io/<你的用户名>/<仓库名小写>:标签
#
# 保存配置报 EACCES：确保 ./config.json 对容器内用户可写。镜像入口会尝试 chown/chmod
# CONFIG_PATH 指向的文件；若仍失败（如部分桌面 Docker），在宿主机执行：
#   chmod u+rw config.json
# 或 chown 为镜像内 UID 1001：  chown 1001:1001 config.json

services:
  gateway:
    image: ghcr.io/hurryhuang1007/proxy-subscribe-merge:latest
    build: .
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      CONFIG_PATH: "/config/config.json"
      SESSION_SECRET: "请替换为至少32位随机字符串_abcdefghijklmnop"
      SESSION_COOKIE_SECURE: "false" # HTTP 部署建议 false；HTTPS 可设为 true
    volumes:
      - ./config.json:/config/config.json
