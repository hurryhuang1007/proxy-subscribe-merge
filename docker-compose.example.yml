# 复制为 docker-compose.yml，放好 merge-config.json 后在同目录执行：
#   docker compose up -d --build

services:
  gateway:
    build: .
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      MERGE_CONFIG_PATH: "/config/merge-config.json"
    volumes:
      - ./merge-config.json:/config/merge-config.json:ro
