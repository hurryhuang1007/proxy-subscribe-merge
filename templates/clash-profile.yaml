mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
external-controller: '127.0.0.1:9090'
dns:
  enable: true
  default-nameserver: [223.5.5.5, 119.29.29.29, 114.114.114.114]
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  nameserver: [system, 'https://223.5.5.5/dns-query', 'https://doh.pub/dns-query', 'https://dns.alidns.com/dns-query']
  proxy-server-nameserver: ['https://223.5.5.5/dns-query', 'https://doh.pub/dns-query']
  fallback: ['https://doh.dns.sb/dns-query', 'https://dns.cloudflare.com/dns-query', 'https://dns.twnic.tw/dns-query', 'tls://8.8.4.4:853']
proxy-groups:
  - name: 🎯 总模式
    type: select
    proxies:
      - Ⓜ️ 延迟最低
      - Ⓜ️ 负载均衡
      - Ⓜ️ 故障切换
      - ♻️ 手动切换
      - DIRECT
  - name: Ⓜ️ 延迟最低
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    include-all: true
  - name: Ⓜ️ 故障切换
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 300
    include-all: true
  - name: Ⓜ️ 负载均衡
    type: load-balance
    strategy: consistent-hashing
    url: http://www.gstatic.com/generate_204
    interval: 300
    include-all: true
  - name: ♻️ 手动切换
    type: select
    include-all: true
    proxies:
      - DIRECT
      - REJECT
  - name: 📬 国外dns
    type: select
    proxies:
      - 🎯 总模式
      - Ⓜ️ 负载均衡
      - Ⓜ️ 延迟最低
      - Ⓜ️ 故障切换
      - ♻️ 手动切换
      - DIRECT
